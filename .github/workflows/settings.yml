---
name: settings
"on":
  push:
    branches:
      - main
  schedule:
    - cron: 42 6 * * *
  workflow_dispatch:
permissions:
  contents: read
jobs:
  settings-action:
    runs-on: ubuntu-24.04
    steps:
      # yamllint disable rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        env:
          GH_TOKEN: ${{ secrets.SETTINGS_ACTION }}
        with:
          description: Settings Action configures the settings of a GitHub repository.
          project: ${{ github.repository }}
          settings_actions_allowed_actions: selected
          settings_actions_github_owned_allowed: true
          settings_actions_verified_allowed: false
          # mcvs-general-action v0.7.x runs lychee-action and
          # markdownlint-cli2-action as nested actions.
          settings_actions_patterns_allowed: 030/*,schubergphilis/*,zizmorcore/zizmor-action@*,lycheeverse/lychee-action@*,davidanson/markdownlint-cli2-action@*
          settings_actions_require_sha_pinning: true
          settings_default_workflow_permissions: read
          settings_delete_branch_on_merge: true
          settings_discussions: false
          settings_github_workflows_can_approve_pull_request_reviews: false
          settings_merge_commit: false
          settings_merge_rebase: false
          settings_merge_squash: true
          settings_projects: false
          settings_protect_main_branch: false
          settings_wiki: false
          topics: github-settings,settings-as-code
