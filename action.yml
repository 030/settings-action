---
name: settings
description: settings
inputs:
  debug:
    default: "false"
    description: |
      Enable debug logging.
    required: true
  description:
    description: |
      The description of the GitHub project.
    required: true
  project:
    description: |
      The name of the GitHub project including the owner, e.g,
      030/settings-action.
    required: true
  settings_actions_allowed_actions:
    default: "all"
    description: |
      Actions permissions: 'all', 'local_only', or 'selected'. Use
      'selected' to allow OWNER and select non-OWNER actions and
      reusable workflows.
    required: true
  settings_actions_github_owned_allowed:
    default: "true"
    description: |
      When settings_actions_allowed_actions is 'selected', whether
      GitHub-owned actions (e.g. actions/checkout) are allowed.
    required: true
  settings_actions_verified_allowed:
    default: "false"
    description: |
      When settings_actions_allowed_actions is 'selected', whether
      actions from verified creators are allowed.
    required: true
  settings_actions_patterns_allowed:
    default: ""
    description: |
      When settings_actions_allowed_actions is 'selected', a
      comma-separated list of allowed actions and reusable workflows,
      e.g. 030/*.
    required: false
  settings_actions_require_sha_pinning:
    default: "false"
    description: |
      Require actions to be pinned to a full-length commit SHA.
    required: true
  settings_default_workflow_permissions:
    default: "read"
    description: |
      Set the default workflow permission to 'read' or 'write'.
    required: true
  settings_discussions:
    default: "false"
    description: |
      Whether the discussions tab should be disabled or enabled.
    required: true
  settings_delete_branch_on_merge:
    default: "true"
    description: |
      Whether a branch should be deleted on merge.
    required: true
  settings_github_workflows_can_approve_pull_request_reviews:
    default: "false"
    description: |
      Whether GitHub workflows can approve pull request reviews.
    required: true
  settings_merge_commit:
    default: "false"
    description: |
      Whether the 'merge commit' option should be disabled or enabled.
    required: true
  settings_merge_rebase:
    default: "false"
    description: |
      Whether the 'merge rebase' option should be disabled or enabled.
    required: true
  settings_merge_squash:
    default: "true"
    description: |
      Whether the 'merge squash' option should be disabled or enabled.
    required: true
  settings_protect_main_branch:
    default: "true"
    description: |
      Whether the main branch should be protected or not.
    required: true
  settings_protect_main_branch_enforce_admins:
    default: "true"
    description: |
      Whether the main branch protection should be enforced for admin as well.
    required: true
  settings_protect_main_branch_required_approving_review_count:
    default: "1"
    description: |
      The number of approvals that is required before a PR can be merged.
    required: true
  settings_projects:
    default: "false"
    description: |
      Whether the projects tab should be disabled or enabled.
    required: true
  settings_wiki:
    default: "false"
    description: |
      Whether the wiki tab should be disabled or enabled.
    required: true
  topics:
    description: |
      At least one topic have to be set.
    required: true
runs:
  using: "composite"
  steps:
    - name: display the gh cli version
      run: gh --version
      shell: bash

    - name: add a description for project ${{ inputs.project }}
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        DESCRIPTION: ${{ inputs.description }}
      run: |
        gh repo edit "$PROJECT" --description="$DESCRIPTION"

    - name: delete branch on merge or not for project ${{ inputs.project }}
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        DELETE_BRANCH_ON_MERGE: ${{ inputs.settings_delete_branch_on_merge }}
      run: |
        gh repo edit "$PROJECT" --delete-branch-on-merge="$DELETE_BRANCH_ON_MERGE"

    # https://docs.github.com/en/rest/actions/permissions?apiVersion=2022-11-28#set-default-workflow-permissions-for-a-repository
    - name: set default_workflow_permissions and can_approve_pull_request_reviews
      shell: bash
      env:
        DEBUG: ${{ inputs.debug }}
        PROJECT: ${{ inputs.project }}
        DEFAULT_WORKFLOW_PERMISSIONS: ${{ inputs.settings_default_workflow_permissions }}
        CAN_APPROVE_PULL_REQUEST_REVIEWS: ${{ inputs.settings_github_workflows_can_approve_pull_request_reviews }}
      run: |
        debug=""
        if [ "$DEBUG" = "true" ]; then
          echo "enable debug logging"
          debug="--verbose"
        fi

        curl \
          --fail \
          --silent \
          ${debug} \
          -L \
          -X PUT \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/${PROJECT}/actions/permissions/workflow" \
          -d "{
            \"default_workflow_permissions\":\"${DEFAULT_WORKFLOW_PERMISSIONS}\",
            \"can_approve_pull_request_reviews\":${CAN_APPROVE_PULL_REQUEST_REVIEWS}
          }"

    # https://docs.github.com/en/rest/actions/permissions?apiVersion=2022-11-28#set-github-actions-permissions-for-a-repository
    - name: set actions permissions for project ${{ inputs.project }}
      shell: bash
      env:
        DEBUG: ${{ inputs.debug }}
        PROJECT: ${{ inputs.project }}
        ACTION_PATH: ${{ github.action_path }}
        ALLOWED_ACTIONS: ${{ inputs.settings_actions_allowed_actions }}
        GITHUB_OWNED_ALLOWED: ${{ inputs.settings_actions_github_owned_allowed }}
        VERIFIED_ALLOWED: ${{ inputs.settings_actions_verified_allowed }}
        PATTERNS_ALLOWED: ${{ inputs.settings_actions_patterns_allowed }}
        REQUIRE_SHA_PINNING: ${{ inputs.settings_actions_require_sha_pinning }}
      run: |
        debug=""
        if [ "$DEBUG" = "true" ]; then
          echo "enable debug logging"
          debug="--verbose"
        fi

        python3 "$ACTION_PATH/main.py" actions-permissions \
          --allowed-actions "$ALLOWED_ACTIONS" \
          --github-owned-allowed "$GITHUB_OWNED_ALLOWED" \
          --verified-allowed "$VERIFIED_ALLOWED" \
          --patterns-allowed "$PATTERNS_ALLOWED" \
          --require-sha-pinning "$REQUIRE_SHA_PINNING"

        curl \
          --fail \
          --silent \
          ${debug} \
          -L \
          -X PUT \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/${PROJECT}/actions/permissions" \
          --data-binary @update-actions-permissions.json

        if [ "$ALLOWED_ACTIONS" = "selected" ]; then
          curl \
            --fail \
            --silent \
            ${debug} \
            -L \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${PROJECT}/actions/permissions/selected-actions" \
            --data-binary @update-actions-selected-actions.json
        fi

    - name: enable or disable the 'discussions' tab for ${{ inputs.project }}
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        DISCUSSIONS: ${{ inputs.settings_discussions }}
      run: |
        gh repo edit "$PROJECT" --enable-discussions="$DISCUSSIONS"

    - name: enable or disable 'merge rebase' for ${{ inputs.project }}
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        MERGE_REBASE: ${{ inputs.settings_merge_rebase }}
      run: |
        gh repo edit "$PROJECT" --enable-rebase-merge="$MERGE_REBASE"

    - name: enable or disable 'merge squash' for ${{ inputs.project }}
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        MERGE_SQUASH: ${{ inputs.settings_merge_squash }}
      run: |
        gh repo edit "$PROJECT" --enable-squash-merge="$MERGE_SQUASH"

    - name: enable or disable 'merge commit' for ${{ inputs.project }}
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        MERGE_COMMIT: ${{ inputs.settings_merge_commit }}
      run: |
        gh repo edit "$PROJECT" --enable-merge-commit="$MERGE_COMMIT"

    - name: enable or disable the 'projects' tab for ${{ inputs.project }}
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        PROJECTS: ${{ inputs.settings_projects }}
      run: |
        gh repo edit "$PROJECT" --enable-projects="$PROJECTS"

    - name: enable or disable the 'wiki' tab for ${{ inputs.project }}
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        WIKI: ${{ inputs.settings_wiki }}
      run: |
        gh repo edit "$PROJECT" --enable-wiki="$WIKI"

    - name: set topics
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        TOPICS: ${{ inputs.topics }}
      run: |
        args=()
        IFS=',' read -ra topics <<< "$TOPICS"
        for topic in "${topics[@]}"; do
          args+=(--add-topic "$topic")
        done
        gh repo edit "$PROJECT" "${args[@]}"

    - name: protect main branch
      shell: bash
      env:
        DEBUG: ${{ inputs.debug }}
        PROJECT: ${{ inputs.project }}
        ACTION_PATH: ${{ github.action_path }}
        ENFORCE_ADMINS: ${{ inputs.settings_protect_main_branch_enforce_admins }}
        REQUIRED_APPROVING_REVIEW_COUNT: ${{ inputs.settings_protect_main_branch_required_approving_review_count }}
      run: |
        repositoryId=$(gh repo view --json id -q '.id' "$PROJECT")
        echo "$repositoryId"

        debug=""
        if [ "$DEBUG" = "true" ]; then
          echo "enable debug logging"
          debug="--verbose"
        fi

        update_branch_protection_rule() {
          python3 "$ACTION_PATH/main.py" branch-protection-rules \
            --enforce-admins "$ENFORCE_ADMINS" \
            --required-approving-review-count "$REQUIRED_APPROVING_REVIEW_COUNT"

          curl \
            --fail \
            --silent \
            ${debug} \
            -L \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${PROJECT}/branches/${branch_to_be_protected}/protection" \
            --data-binary @update-branch-protection-rule.json
        }

        branch_to_be_protected="main"

        if gh api "repos/${PROJECT}/branches/${branch_to_be_protected}/protection"; then
          echo "main branch is protected already. Updating it..."
          update_branch_protection_rule
        else
          echo "main branch not protected. Protecting it..."

          gh api graphql \
            -f query="$(cat "$ACTION_PATH/create-branch-protection-rule.graphql")" \
            -F branchName="${branch_to_be_protected}" \
            -F repositoryId="${repositoryId}"

          update_branch_protection_rule
        fi
      if: ${{ inputs.settings_protect_main_branch == 'true' }}
